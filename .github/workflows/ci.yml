name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint, tests, evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: python -m pytest -q

      # Both evals run without API keys. detection.py exits non-zero on any
      # false positive; grounding.py exits non-zero if any case is misjudged.
      - name: Detection eval
        run: python eval/detection.py --json detection.json

      - name: Evidence Integrity Benchmark
        run: python eval/grounding.py --json grounding.json

      - name: Keep eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: "*.json"
