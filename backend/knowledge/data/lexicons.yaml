# Language-signal lexicons for detectors/language.py.
#
# A plain phrase matcher, not a model: a hit is a fact ("this phrase appears here") the
# verdict can point at.
#
#   terms     whole words or phrases, case-insensitive. Common inflections count (arrest
#             matches arrested) and a space also matches a hyphen (part time, part-time).
#   patterns  optional regular expressions for what a fixed phrase can't express.
#   advisory_sensitive
#             skip sentences that warn about the thing instead of asking for it, e.g. "HDFC
#             Bank will never ask for your UPI PIN". Banks send those warnings constantly.
#   severity  0-3, how strongly the category nudges the risk floor.
#
# Terms that fired on ordinary messages in tests/test_hard_negatives.py were removed or
# narrowed: fine, court, between us, beneficiary, deposit of, convenience fee, hiring team,
# recruitment team, a bare "guaranteed", and noun-only credential words such as "card
# number" or "verification code" that every genuine OTP and card alert contains.
#
# A few Hindi/Hinglish terms are included because many scams aimed at India arrive that way.

lexicons:
  - id: language.urgency
    label: Manufactured urgency
    severity: 1
    terms:
      - act now
      - immediately
      - within 24 hours
      - within 2 hours
      - last chance
      - expires today
      - urgent
      - urgently
      - hurry
      - right now
      - before it's too late
      - account will be closed
      - account will be suspended
      - final notice
      - turant
      - abhi

  - id: language.threat
    label: Threat or intimidation
    severity: 2
    terms:
      - arrest
      - arrest warrant
      - legal action
      - lawsuit
      - police
      - fir will be filed
      - court case
      - court order
      - court summons
      - court notice
      - deportation
      - your account has been frozen
      - blocked permanently
      - penalty
      - fined
      - pay a fine
      - jail
      - non-bailable
      - money laundering
      - illegal parcel

  - id: language.secrecy
    label: Pressure to keep it secret / stay on the line
    severity: 2
    terms:
      - do not tell anyone
      - don't tell anyone
      - do not tell your family
      - don't tell your family
      - keep this confidential
      - do not disconnect
      - stay on the line
      - stay on this call
      - stay on the call
      - do not hang up
      - don't inform your bank
      - just between us
      - keep this between us
      - confidential matter

  - id: language.too_good
    label: Too good to be true
    severity: 2
    terms:
      - guaranteed returns
      - guaranteed profit
      - risk free
      - double your money
      - you have won
      - you've won
      - congratulations you
      - lucky winner
      - free gift
      - claim your prize
      - lottery
      - 100% profit
      - no risk
      - earn from home
      - work from home earn
    patterns:
      # "guaranteed" next to a percentage return, in either order
      - '\d+\s*%[^.!?\n]{0,30}\bguaranteed\b'
      - '\bguaranteed\b[^.!?\n]{0,30}\d+\s*%'

  - id: language.recruitment_bait
    label: Unsolicited "easy money" job bait
    severity: 2
    terms:
      - part time job
      - part time online job
      - work from home
      - per task
      - daily income
      - high commission
      - unlock the
      - ghar baithe
      - daily kamao

  - id: language.credentials
    label: Asks for a secret code or credential
    severity: 3
    advisory_sensitive: true
    terms:
      - share otp
      - share the otp
      - share your otp
      - send otp
      - send the otp
      - send your otp
      - send me the otp
      - tell me the otp
      - tell me your otp
      - enter your otp
      - share the code
      - share the verification code
      - send the verification code
      - enter upi pin
      - enter your upi pin
      - share your upi pin
      - share your pin
      - share your mpin
      - cvv
      - share your card number
      - send your card number
      - net banking password
      - share your password

  - id: language.remote_access
    label: Wants remote access to your device
    severity: 3
    advisory_sensitive: true
    terms:
      - anydesk
      - teamviewer
      - ultraviewer
      - quicksupport
      - install this app
      - remote access
      - download the app to fix

  - id: language.off_platform
    label: Moves you off the platform / onto a new number
    severity: 1
    terms:
      - contact me on whatsapp
      - message me on telegram
      - my new number
      - this is my new number
      - i lost my phone
      - add me on telegram
      - dm me
      - text me on
      - wrong number
      - only works through me
      - link only works

  - id: language.payment_push
    label: Pushes an immediate payment
    severity: 2
    terms:
      - pay the fee
      - processing fee
      - clearance fee
      - customs charge
      - refundable deposit
      - security deposit
      - pay to release
      - recharge to withdraw
      - registration fee
      - gst charge
      - pay a small amount
      - tax fee
      - withdrawal fee
      - small fee
      - return the extra
      - overpaid
      - sent too much

  - id: language.tech_bait
    label: Fake infection / tech-support hook
    severity: 2
    terms:
      - virus detected
      - detected a virus
      - computer is infected
      - device is infected
      - your account has been compromised
      - we detected suspicious activity

  - id: language.loan_bait
    label: Predatory instant-loan hook
    severity: 2
    terms:
      - instant loan
      - loan approved
      - no credit check
      - no documents
      - gallery access
      - contacts access
      - allow contacts

  - id: language.advance_fee_bait
    label: Advance-fee / beneficiary hook
    severity: 2
    terms:
      - as the beneficiary
      - bequest
      - the beneficiary of
      - next of kin
      - inheritance
      - unclaimed funds
      - unclaimed inheritance
      - selected as the winner
      - you have been chosen
