# Language-signal lexicons.
#
# These feed a simple, transparent phrase matcher (detectors/language.py). It is
# deliberately NOT a model — a match is a fact ("this phrase appears here") that
# we can point at, which is exactly what keeps the verdict honest. The model gets
# to interpret; the matcher only reports what's literally present.
#
# Phrases are matched case-insensitively as substrings. A few Hindi/Hinglish
# terms are included because a lot of scams targeting India arrive that way.
#
# severity: 0-3, how strongly the category nudges the risk score.

lexicons:
  - id: language.urgency
    label: Manufactured urgency
    severity: 1
    terms:
      - act now
      - immediately
      - within 24 hours
      - within 2 hours
      - last chance
      - expires today
      - urgent
      - hurry
      - right now
      - before it's too late
      - account will be closed
      - account will be suspended
      - final notice
      - turant
      - abhi

  - id: language.threat
